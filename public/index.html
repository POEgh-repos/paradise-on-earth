<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- ── Primary Meta ── -->
  <title>PARADISE on Earth — African Creative NFT Market</title>
  <meta name="description" content="Buy, collect and flex African creative NFTs. Music, fashion, upcycled art and more — pay with MoMo." />
  <meta name="keywords" content="NFT, African art, music NFT, fashion NFT, MoMo, Ghana, Nigeria, Accra, Lagos, Web3 Africa, blockchain" />
  <meta name="author" content="PARADISE on Earth" />
  <meta name="theme-color" content="#06060e" />
  <meta name="color-scheme" content="dark" />

  <!-- ── Open Graph (Facebook, WhatsApp, LinkedIn) ── -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="PARADISE on Earth — African Creative NFT Market" />
  <meta property="og:description" content="Buy, collect and flex African creative NFTs. Pay with MoMo." />
  <meta property="og:url"         content="https://paradiseonearth.io" />
  <meta property="og:image"       content="/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height"content="630" />
  <meta property="og:locale"      content="en_GH" />
  <meta property="og:site_name"   content="PARADISE on Earth" />

  <!-- ── Twitter Card ── -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="PARADISE on Earth" />
  <meta name="twitter:description" content="African Creative NFT Market. Pay with MoMo." />
  <meta name="twitter:image"       content="/og-image.png" />
  <meta name="twitter:site"        content="@paradiseonearth" />

  <!-- ── Apple / PWA ── -->
  <meta name="apple-mobile-web-app-capable"          content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title"            content="PARADISE" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- ── Favicons ── -->
  <link rel="icon"             type="image/x-icon"  href="/favicon.ico" />
  <link rel="icon"             type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon"             type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest"         href="/manifest.json" />

  <!-- ── Canonical ── -->
  <link rel="canonical" href="https://paradiseonearth.io" />

  <!-- ── Fonts preconnect (performance) ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- ── Base styles (prevent flash) ── -->
  <style>
    html, body, #root { height: 100%; }
    body { margin: 0; background: #06060e; color: #f0ece6; overflow-x: hidden; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run PARADISE on Earth.</noscript>
  <div id="root"></div>

</html>
